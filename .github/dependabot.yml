version: 2
# Grouping: each ecosystem gets one `minor-and-patch` group and one `major`
# group, so majors arrive as a single PR per ecosystem instead of one PR each.
# Security updates keep their own group. Majors we are not ready for are listed
# under `ignore` with the reason and date.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "drizzle-orm"
        update-types: ["version-update:semver-major"]
      - dependency-name: "drizzle-kit"
        update-types: ["version-update:semver-major"]
      # 2026-11-18: typescript 7 is not usable yet. eslint-config-next pulls
      # typescript-eslint, whose peer range is typescript >=4.8.4 <6.1.0 (it throws
      # "does not support TS 7.0" and `npm run lint` fails). Revisit when
      # typescript-eslint supports TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]
      security:
        applies-to: security-updates
        patterns: ["*"]
